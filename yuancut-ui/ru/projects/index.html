вать\",\"k214e57aa\":\"Поставщик видео\",\"k21e6da24\":\"Наложения текста и стикеров\",\"k21fbce40\":\"Стикеры\",\"k22051b82\":\"{{num}} предметов\",\"k229afd33\":\"Файлы остаются на вашем устройстве\",\"k22f5b65d\":\"В отличие от CapCut, YuanCut полностью с открытым исходным кодом и работает полностью в вашем браузере. Ваши медиафайлы остаются на вашем устройстве — только функции ИИ могут взаимодействовать с внешними сервисами. YuanCut является нативным ИИ с встроенным ИИ-агентом, генерацией изображений и транскрипцией аудио, без необходимости в учетной записи или подписке.\",\"k23deaf7c\":\"Управлять\",\"k24988f4e\":\"Развертывание на собственном сервере\",\"k24cda7d3\":\"Выберите стиль\",\"k25102eb0\":\"Генерация речи {{current}}/{{total}}...\",\"k252689b9\":\"Предварительный просмотр изображения\",\"k25320384\":\"Горячие клавиши\",\"k25c84b25\":\"Субтитры\",\"k263a773f\":\"Голос\",\"k267e5d8b\":\"Включить звук\",\"k27001ed\":\"Сгенерировать\",\"k27275e6d\":\"Меню проекта\",\"k2765ee2e\":\"Завершить\",\"k27824d60\":\"Обновление проектов с v{{from}} до v{{to}}\",\"k27a0e821\":\"Автоматически переключается между экспертными ролями для выполнения сложных задач\",\"k283adf93\":\"Новое имя\",\"k283ebc49\":\"Загружает ли YuanCut мои файлы на сервер?\",\"k2850aaf5\":\"Импортировать субтитры\",\"k288ace0f\":\"Транскрибирование {{progress}}%\",\"k28e32d50\":\"Добавить на временную шкалу\",\"k290f0649\":\"Переключено на {{role}}\",\"k29107234\":\"Экспорт без водяных знаков\",\"k29177ca9\":\"Бесплатна ли YuanCut в использовании?\",\"k2967f1d0\":\"Пожалуйста, введите подсказку\",\"k2a2149dd\":\"Открыть в новом окне\",\"k2aedb887\":\"Поставщик изображений не настроен\",\"k2b5f260e\":\"Обратная связь\",\"k2cade977\":\"Не удалось загрузить изображение\",\"k2cecf817\":\"Тип\",\"k2d7fcfb9\":\"Переименовать проект\",\"k2d870a80\":\"Масштаб\",\"k2dad13e3\":\"Язык\",\"k2db24d45\":\"С открытым исходным кодом\",\"k2dfc51dd\":\"Ваши результаты генерации изображений и видео AI появятся c9b6\":\"Выберите провайдера\",\"kc5150ae0\":\"Смещение Y\",\"kc634a9e2\":\"Пока нет изображений для справки\",\"kc681fb70\":\"Показаны только звуки, лицензированные для коммерческого использования\",\"kc69f8562\":\"Да. YuanCut не требует регистрации или входа в систему. Просто откройте веб-сайт и начните редактировать сразу. Ваши проекты сохраняются локально в вашем браузере.\",\"kc6a47bc6\":\"Корректировка\",\"kc6bdfdb6\":\"Веб-редактирование видео\",\"kc7ab503b\":\"Не удалось сохранить звук\",\"kc7dc4ec3\":\"Часто задаваемые вопросы\",\"kc89cafdb\":\"Настройки агента\",\"kc89e3217\":\"Свойства\",\"kc91e781\":\"Да. YuanCut работает полностью в вашем браузере и совместима с любой платформой, включая Chromebook, общие компьютеры и планшеты — установка или плагины не требуются.\",\"kca93c7a9\":\"Не удалось удалить проект\",\"kcaa5ffae\":\"Поиск всех стикеров\",\"kcabf9c30\":\"Не удалось загрузить эталонное изображение\",\"kcb438e10\":\"Аудиоредактор\",\"kcb71a844\":\"Пожалуйста, введите действительный URL\",\"kcb9f08cb\":\"Сгенерировать портрет\",\"kcbab7f7a\":\"Иконки\",\"kcbd30819\":\"API Ключ\",\"kcbf8fa1e\":\"Посмотреть на GitHub\",\"kcc24dba3\":\"Создайте свой первый проект\",\"kcd643ef3\":\"Загрузка...\",\"kcd938153\":\"Добро пожаловать в YuanCut Beta! 🎉\",\"kcde8f2fe\":\"Часто задаваемые вопросы\",\"kcdfc6e09\":\"Назад\",\"kce04c331\":\"Сравнение функций по пунктам\",\"kcee7d1f2\":\"Скорость\",\"kcf50536d\":\"Начните создавать свой первый проект. Импортируйте медиа, редактируйте и экспортируйте ваши видео. Все приватно.\",\"kd00afaa7\":\"Поворот\",\"kd00e429a\":\"Включить аудио в экспорт\",\"kd029b797\":\"Использовать персонажа в качестве ссылки (по желанию)\",\"kd06a4cfa\":\"Функция\",\"kd0b7ee96\":\"Политика конфиденциальности CapCut, Раздел I — Информация, которую мы собираем\",\"kd0fa2533\":\"Здесь пусто\",\"kd0fde7ce\":\"Присоединяйтесь к нашему [Discord]({{url}}), общайтесь с классными людьми и делитесь отзывами, чтобы помочь сделать YuanCut лучшим редактором.\",\"kd13c4cc1\":\"Речь успешно сгенерирована\",\"kd16bbd7f\":\"Установка не требуется. Откройте ваш браузер на любой платформе и начните редактировать прямо сейчас.\",\"kd1e4a3ee\":\"Главная\",\"kd1fd0230\":\"Нажмите, чтобы изменить ярлык\",\"kd231728d\":\"Разделить влево\",\"kd2c0aec0\":\"Закрыть\",\"kd2c0c394\":\"Повторить\",\"kd3baf74c\":\"Не удалось переименовать проект\",\"kd3d73426\":\"Удалить изображение для справки\",\"kd3f12272\":\"Генерация субтитров...\",\"kd4039459\":\"Выключить звук трека\",\"kd48f5db5\":\"YuanCut — это редактор видео, основанный на ИИ, с открытым исходным кодом, который работает полностью в вашем браузере. Это бесплатная альтернатива CapCut с приоритетом конфиденциальности — никакой установки или регистрации не требуется, просто откройте веб-сайт и начните редактировать.\",\"kd5a3b397\":\"Добавить закладку\",\"kd701831b\":\"Пожалуйста, сначала введите описание персонажа\",\"kd724d5fe\":\"Добавить изображение для справки (по желанию)\",\"kd7cd59be\":\"Нажмите на элемент на временной шкале, чтобы изменить его свойства\",\"kd8f8d31a\":\"Основные\",\"kd91677e9\":\"Формат\",\"kd9787dd2\":\"Могу ли я использовать YuanCut на Chromebook?\",\"kd9bc1991\":\"Аудио\",\"kda2284d8\":\"Является ли YuanCut открытым исходным кодом?\",\"kda2e3020\":\"Генерация...\",\"kdb078710\":\"Что у вас на уме?\",\"kdbe97304\":\"Подтвердить все\",\"kdc12f70b\":\"Сгенерированные видео ({{num}})\",\"kdc1af77b\":\"Поиск иконок\",\"kdc541d5\":\"Сбросить на умолчание\",\"kde0eccb1\":\"Средний - Сбалансированный\",\"kde315178\":\"Переименовать\",\"kdec42621\":\"В основных субтитрах {{primary}} строк, а во вторичных — {{secondary}}. Они должны совпадать построчно.\",\"kdecab165\":\"Да, YuanCut совершенно бесплатна. Это программное обеспечение с открытым исходным кодом, лицензированное по разрешающей лицензии. Нет скрытых сборов, подписок или премиум-уровней.\",\"kdedf4feb\":\"Нажмите на переход, чтобы применить его к смежным клипам. Вы также можете нажать на иконку соединения между клипами на временной шкале.\",\"kdf331174\":\"Произошла неожиданная ошибка\",\"kdf3f764e\":\"Видео ({{num}})\",\"kdf5644c3\":\"Субтитры\",\"kdfa2aff1\":\"Нет\",\"ke02e5c67\":\"Настройки проекта\",\"ke03fe3d9\":\"Настольное приложение работает в оффлайне\",\"ke05cc4e7\":\"Закрытое проприетарное\",\"ke0f3a7c5\":\"Конфиденциальность в первую очередь\",\"ke16a8666\":\"Сгенерировано {{num}} изображений\",\"ke19dea87\":\"Введите URL для импорта удаленного медиафайла (изображение, видео или аудио).\",\"ke1a34496\":\"Экспортировать текущий кадр\",\"ke1ec01c\":\"Поиск брендов\",\"ke247a1fb\":\"Отсоединить аудио\",\"ke2d72ef7\":\"Нет активного проекта\",\"ke2f48535\":\"Нет медиафайлов\",\"ke3d38b5e\":\"Пропустить подтверждение для операций генерации AI\",\"ke43a5faa\":\"Помогите нам улучшить YuanCut — дайте нам знать, что работает, что нет, или что вы хотели бы увидеть.\",\"ke4f4b3eb\":\"Обеспечивает, чтобы весь сгенерированный контент сохранял согласованный визуальный стиль.\",\"ke5ee8140\":\"Внешний вид\",\"ke60ee61b\":\"Не удалось добавить звук на временную шкалу\",\"ke63267e3\":\"Без установки\",\"ke662c716\":\"Полностью с открытым исходным кодом на GitHub\",\"ke7160b4b\":\"YuanCut охватывает основные функции редактирования, которые нужны большинству создателей: многодорожечная временная шкала, текстовые и наклейки, генерация изображений с помощью AI, транскрипция аудио и генерация субтитров. CapCut предлагает дополнительные продвинутые функции, такие как шаблоны эффектов и больше форматов экспорта, но YuanCut быстро развивается как проект с открытым исходным кодом.\",\"ke76bd0ba\":\"Стикеры не найдены\",\"ke80169a4\":\"Подготовка аудио...\",\"ke80749d7\":\"История\",\"ke84240ac\":\"Поделитесь вашей обратной связью\",\"ke88a4d09\":\"Выполняется: {{tool}}\",\"ke8a50ba6\":\"Не удалось импортировать изображение\",\"ke8d5c314\":\"Портрет персонажа сгенерирован\",\"ke8e4016\":\"По типу\",\"kea1d7a1e\":\"Клип экспортирован\",\"kea4ea1f3\":\"История генерации по
