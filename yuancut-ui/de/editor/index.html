erungen bearbeiten kann, KI-Bilderzeugung zur Erstellung von Visuals und Audio-Transkription zur automatischen Generierung von Untertiteln. Diese Funktionen sind in den Kernbearbeitungsworkflow integriert.\",\"k1d43a4\":\"Spezialisiert auf Audio-Mischung, Untertitel und Voice-over\",\"k1db77587\":\"oder\",\"k1dc93027\":\"Standardtext\",\"k1dcef5ce\":\"Clips exportieren\",\"k1dea0456\":\"Ein Untertitelimport wird bereits durchgeführt\",\"k1e16fe30\":\"Untertitel importiert\",\"k1e357029\":\"Schriftgröße\",\"k1e68fe8a\":\"YuanCut-Einführung\",\"k1e8e8c34\":\"Spezialisiert auf Tempo, Übergänge und Zeitlinienstruktur\",\"k1f0ee77d\":\"Vom Gerät\",\"k1f61d17e\":\"Textdauer ausrichten\",\"k1fbd515d\":\"Klicken Sie hier, um das vollständige Bild anzuzeigen\",\"k1fce7b6a\":\"Alle auswählen\",\"k2024b45c\":\"Fehler beim Hinzufügen des Stickers zur Timeline\",\"k20dc25e7\":\"Charakter erstellen\",\"k20e029b\":\"Hoch - Empfohlen\",\"k21041a9\":\"Konvertiere {{count}} Text in Sprache...\",\"k21041a9_plural\":\"Konvertiere {{count}} Text in Sprache...\",\"k21077124\":\"Bearbeiten\",\"k214e57aa\":\"Videoanbieter\",\"k21e6da24\":\"Text- und Sticker-Overlays\",\"k21fbce40\":\"Sticker\",\"k22051b82\":\"{{num}} Artikel\",\"k229afd33\":\"Dateien bleiben auf deinem Gerät\",\"k22f5b65d\":\"Im Gegensatz zu CapCut ist YuanCut vollständig Open Source und läuft vollständig in Ihrem Browser. Ihre Mediendateien bleiben auf Ihrem Gerät – nur KI-Funktionen können mit externen Diensten kommunizieren. YuanCut ist KI-nativ mit integriertem KI-Agenten, Bildgenerierung und Audio-Transkription, ohne dass ein Konto oder ein Abonnement erforderlich ist.\",\"k23deaf7c\":\"Verwalten\",\"k24988f4e\":\"Auf deinem eigenen Server bereitstellen\",\"k24cda7d3\":\"Wählen Sie einen Stil\",\"k25102eb0\":\"Sprache wird generiert {{current}}/{{total}}...\",\"k252689b9\":\"Bildvorschau\",\"k25320384\":\"Tastenkombinationen\",\"k25c84b25\":\"Untertitel\",\"k263a773f\":\"Stimme\",\"k267e5d8b\":\"Stummschalten\",\"k270  Mehrspur-Zeitleiste\",\"k39d41ee2\":\"Jede Untertitelzeile darf für Sprache maximal 2000 Zeichen enthalten\",\"k3a3b30db\":\"Ein KI-nativer, Open-Source-Video-Editor und kostenlose Alternative zu CapCut. Keine Uploads, kein Tracking — Ihre Medien bleiben auf Ihrem Gerät.\",\"k3b8ba7c7\":\"Text\",\"k3c229af1\":\"Konfigurieren Sie eine OpenAI-kompatible API, um den KI-Agenten zu verwenden.\",\"k3c3bf6aa\":\"Vollständig Open Source und von der Community betrieben. Überprüfen Sie den Code, tragen Sie bei oder forken Sie ihn für Ihre Bedürfnisse.\",\"k3cc98f4d\":\"Danke für Ihr Feedback!\",\"k3d9e142a\":\"Löschen \\\"{{name}}\\\"?\",\"k3dbe79b1\":\"Löschen\",\"k3df1a6aa\":\"Exportieren Sie Ihre Projekte im MP4- oder WebM-Format mit anpassbaren Qualitätseinstellungen.\",\"k3eca2836\":\"Suche löschen\",\"k3f0b280a\":\"Bildrate\",\"k4058f0d2\":\"Bitte konfigurieren Sie einen Bildanbieter in den Einstellungen\",\"k406e9ad8\":\"Bestätigen\",\"k40be1e8c\":\"Standbild wird erstellt\",\"k417fbb63\":\"Erstellen Sie Ihren ersten Charakter\",\"k41994be6\":\"direkt in Ihrem Browser\",\"k41ce4981\":\"Basisbearbeitung\",\"k41d1dc41\":\"KI-Agent, Bilderzeugung, Transkription\",\"k4340d39b\":\"Alles löschen\",\"k434214cc\":\"Rückgängig machen\",\"k43632b85\":\"Zu den Assets hinzugefügt\",\"k4426d7b0\":\"Ihre E-Mail oder Social Handle (optional)\",\"k443d261b\":\"Fügt niemals Wasserzeichen hinzu\",\"k4469c1c9\":\"Löschen von {{count}} Elementen\",\"k4469c1c9_plural\":\"Löschen von {{count}} Elementen\",\"k45172413\":\"Bitte laden Sie zuerst ein Referenzbild hoch\",\"k452013a2\":\"Exportieren\",\"k45d499d0\":\"Drücken Sie eine beliebige Tastenkombination...\",\"k45e5d14f\":\"Export fehlgeschlagen\",\"k464aaefd\":\"Entwicklung\",\"k4652c46e\":\"Mehr Optionen\",\"k465df53\":\"Track ausblenden\",\"k46b6be45\":\"Funktionen\",\"k471ba968\":\"Position Y\",\"k47738d94\":\"In Sprache umwandeln\",\"k47df597b\":\"Warum nicht CapCut?\",\"k48ba53e3\":\"Spezialisiert auf visuelle Komposition, Farbkor 6ab\":\"Automatisch in AI-Generierungsaufforderungen injiziert für ein konsistentes Erscheinungsbild der Charaktere.\",\"k5844fa43\":\"Überspringen\",\"k5886575\":\"Überall exportieren\",\"k5903f2c4\":\"Analyse des Bildes fehlgeschlagen\",\"k59065290\":\"Konto erforderlich\",\"k59d5ddfd\":\"Mehrspur-Zeitleiste\",\"k5a68e193\":\"Chat löschen\",\"k5aa5718b\":\"Element löschen\",\"k5ad0412b\":\"Probleme melden\",\"k5b4aad97\":\"Dies wird {{num}} Projekte und alle zugehörigen Dateien dauerhaft löschen.\",\"k5c0b1e7c\":\"Spiegeln\",\"k5c9de83f\":\"GitHub\",\"k5ce0659c\":\"Projekt beenden\",\"k5ce131c3\":\"Video wird generiert...\",\"k5d278f95\":\"Platzhaltermodus\",\"k5d4271b8\":\"Clip heruntergeladen\",\"k5d5df6f0\":\"Leinwandgröße auswählen\",\"k5d93c0e2\":\"Ihre Dateien verlassen niemals Ihr Gerät. Alle Verarbeitung erfolgt lokal in Ihrem Browser — keine Uploads, keine Server.\",\"k5df46223\":\"Suche...\",\"k5e512deb\":\"API-Schlüssel eingeben\",\"k5e9a1ad5\":\"Sind Sie sicher, dass Sie \\\"{{name}}\\\" löschen möchten? Dadurch werden alle Referenzbilder und die Generierungshistorie für diesen Charakter entfernt.\",\"k5f018ca\":\"🦋 Viel Spaß beim Testen!\",\"k6057c644\":\"Element teilen\",\"k610f9028\":\"Fehler beim Herunterladen des Clips\",\"k612de5c5\":\"Referenzbild\",\"k615420b\":\"Konvertiere {{count}} in Sprache\",\"k615420b_plural\":\"Konvertiere {{count}} in Sprache\",\"k61742ee7\":\"Drag-and-Drop-Medienimport\",\"k617b20be\":\"Track anzeigen\",\"k629b9e5b\":\"Unbekannt\",\"k63a3035f\":\"Erstellen Sie Charaktere in der Charakterbibliothek, die als Referenzbilder verwendet werden können.\",\"k63cebbe\":\"Bildanbieter\",\"k64023576\":\"Rechts teilen\",\"k64b382b4\":\"In allen Symbolen suchen\",\"k65ad505\":\"Ja, YuanCut ist vollständig Open Source und gemeinschaftsgetrieben. Sie können den Quellcode einsehen, beitragen oder ihn auf GitHub forken.\",\"k65caa88b\":\"Rückwärts\",\"k674a8d3\":\"Das aktive Projekt oder die Szene wurde geändert. Bitte erneut importie rierung\",\"k790e4102\":\"Marken\",\"k7927b58d\":\"Argumente\",\"k7969d4e1\":\"Auto (Direktor)\",\"k7a9fdb71\":\"Projekt wird exportiert\",\"k7aae526f\":\"Ziehen Sie Videos, Fotos und Audiodateien hierher\",\"k7aee6f3c\":\"{{name}}-Übergang auf alle benachbarten Clip-Verbindungsstellen anwenden\",\"k7b0d957b\":\"Alles löschen\",\"k7b2d9e9f\":\"Lieder\",\"k7b4b914d\":\"Schnittberater\",\"k7cee310f\":\"Stil-Sperre\",\"k7d0d011c\":\"Bildgenerierung fehlgeschlagen\",\"k7d808e24\":\"Erstellt\",\"k7e1b4773\":\"Läuft vollständig in deinem Browser\",\"k7e2b5dc4\":\"Jede Zeile erhält passende Sprache. Untertitel und Audio beginnen am Abspielkopf.\",\"k7e7d78b8\":\"Assets\",\"k7ee1c203\":\"Professionelle Zeitleiste mit Unterstützung für Video-, Audio-, Text- und Sticker-Spuren. Ziehen, schneiden und teilen Sie mit Leichtigkeit.\",\"k7f29e296\":\"Dauer\",\"k7f3e1754\":\"Beschreiben Sie das Video, das Sie generieren möchten...\",\"k80727fbe\":\"{{num}} Ergebnisse\",\"k812d32fb\":\"Wie unterscheidet sich YuanCut von CapCut?\",\"k816426df\":\"Allzweck-Video-Bearbeitungsassistent\",\"k81e01df2\":\"MP4, MOV und mehr\",\"k81e2a271\":\"Transkription\",\"k8218d317\":\"Funktioniert YuanCut offline?\",\"k830bcb9f\":\"Sprache auswählen\",\"k83c2981e\":\"Bitte teilen Sie Ihr Feedback\",\"k83fb301b\":\"{{count}} Operationen bestätigen\",\"k83fb301b_plural\":\"{{count}} Operationen bestätigen\",\"k8401ad1\":\"Dateien konnten nicht verarbeitet werden\",\"k8485f7ad\":\"Quelle: CapCut Datenschutzrichtlinie, Abschnitt I\",\"k84940e04\":\"Importiere...\",\"k84fa6b77\":\"Medien ersetzen\",\"k85b2d79c\":\"Von gespeichert entfernen\",\"k85db140f\":\"Viele Funktionen fehlen noch. Wir arbeiten hart daran, sie zu entwickeln!\",\"k85ecf712\":\"Sound konnte nicht entfernt werden\",\"k866686f4\":\"Beginnen Sie mit dem Mitwirken\",\"k86dc9875\":\"Wenn Sie neugierig sind, schauen Sie sich unseren Fahrplan [hier](https://yuancut.local/roadmap) an.\",\"k874fb9b9\":\"Dateigröße\",\"k87b60536\":\"Effekte\",\"k o zurückgegeben\",\"k9728a218\":\"Neuer Charakter\",\"k97a88cd0\":\"Desktop-App erfordert Installation\",\"k97caf1aa\":\"Denken...\",\"k97cff734\":\"Überprüfung des Video-Status fehlgeschlagen\",\"k989cf9dd\":\"Bitte konfigurieren Sie einen Videoanbieter in den Einstellungen\",\"k9927a641\":\"Fehlgeschlagen\",\"k99306c93\":\"KI-nativer Video-Editor\",\"k99340292\":\"Charakter bearbeiten\",\"k998db681\":\"MP4- und WebM-Export\",\"k99a2f6b6\":\"Sekundär\",\"k9a03e7a0\":\"{{success}} konvertiert, {{fail}} fehlgeschlagen\",\"k9ae2cb2b\":\"Importieren\",\"k9bb908f9\":\"Text\",\"k9bc722a8\":\"Speicher\",\"k9bcf5e8b\":\"Quellvideo ist nicht verfügbar\",\"k9bf49121\":\"Suche...\",\"k9c0ed6c1\":\"Welche Exportformate unterstützt YuanCut?\",\"k9c40dc21\":\"Medien anzeigen\",\"k9c42f2b9\":\"MP4 und WebM\",\"k9c9388e5\":\"Kostenloses Angebot mit kostenpflichtigem Pro-Plan\",\"k9dfe9154\":\"optional\",\"k9e8a344\":\"Fehler beim Importieren von Medien von der URL\",\"ka07030c6\":\"Konto erforderlich\",\"ka18b2040\":\"Einreichen...\",\"ka28aa063\":\"{{name}} Vorschau\",\"ka294a343\":\"Nicht für Self-Hosting verfügbar\",\"ka383444c\":\"Von URL importieren\",\"ka4061dcd\":\"Dies wird \\\"{{name}}\\\" und alle zugehörigen Dateien dauerhaft löschen.\",\"ka41dbf02\":\"Weiter\",\"ka45b84c6\":\"Verarbeite deine Dateien ({{progress}}%)\",\"ka47f5463\":\"Emojis suchen\",\"ka4f67dd1\":\"Medien-ID kopieren\",\"ka50135f9\":\"Erstellen Sie KI-Charakterkarten mit frontalen Porträts. Verwenden Sie sie als Referenzbilder für konsistente KI-Generierung.\",\"ka5141646\":\"Farbe vom Bildschirm aufnehmen\",\"ka57ba9b2\":\"Track aktivieren\",\"ka61d0efa\":\"Modifiziert\",\"ka6a507e\":\"Symbole\",\"ka796613c\":\"Zu Rasteransicht wechseln\",\"ka79767ed\":\"Farbe\",\"ka7a3f3f8\":\"Fehler: {{message}}\",\"ka7bb958f\":\"KI\",\"ka7c4adc5\":\"Leinwandhöhe\",\"ka7cb70cd\":\"Standbild konnte nicht erstellt werden\",\"ka816c749\":\"Keine Sticker für \\\"{{query}}\\\" gefunden\",\"ka833003a\":\"Videoerstellung abgeschlossen\",\"ka877374b\":\"Projekt-ID\",\"ka96bbd3a\":\"Spezialisiert auf narrative Struktur, emotionale Entwicklung und kreative Leitung\",\"kaa748ff5\":\"Löschen {{type}}\",\"kabed8e08\":\"Medien\",\"kac94dcc8\":\"Dateien auf Server hochgeladen\",\"kacad5657\":\"Elemente einfügen\",\"kacd7f5e2\":\"Keine benachbarten Clips gefunden. Platziere Clips zuerst nebeneinander auf einer Videospur.\",\"kad201467\":\"Clip\",\"kad4c4425\":\"Alle gespeicherten Sounds löschen?\",\"kadd990f0\":\"Sehr hoch - Größte Dateigröße\",\"kaddddf1c\":\"Bitte versuche es erneut\",\"kaea3203c\":\"Projekt wird aktualisiert\",\"kaf4aa9d7\":\"MP4 (H.264) - Bessere Kompatibilität\",\"kafab5b82\":\"Syntax-Benutzeroberfläche\",\"kafd3c560\":\"Kürzliche Sticker löschen\",\"kb01f4f95\":\"Fertig\",\"kb090ddd\":\"Preis\",\"kb0afee65\":\"Ja. YuanCut ist vollständig Open Source und auf GitHub verfügbar. Du kannst den Code einsehen, beitragen, ihn forken oder selbst hosten auf deinem eigenen Server.\",\"kb19977c1\":\"Gib einen neuen Namen ein\",\"kb1cae008\":\"Sounddatei nicht verfügbar\",\"kb2123a76\":\"Versatz X\",\"kb2b2a2a1\":\"Ist YuanCut wirklich kostenlos ohne Wasserzeichen?\",\"kb2b5eb53\":\"Wähle einen Anbieter und gib deinen API-Schlüssel in den Einstellungen ein, um zu beginnen.\",\"kb2f18b92\":\"Standbild erstellt\",\"kb30f328c\":\"Qualität\",\"kb397146e\":\"Standbild\",\"kb4acc248\":\"Geben Sie einen Untertitel pro Zeile ein\",\"kb4acdc25\":\"Du gehörst zu den Ersten, die YuanCut ausprobieren - die vollständig Open-Source-Alternative zu CapCut.\",\"kb69328ed\":\"Gib die Medien-URL ein\",\"kb7105c80\":\"Welche KI-Funktionen bietet YuanCut im Vergleich zu CapCut?\",\"kb7ca5e11\":\"Filter\",\"kb7dbf084\":\"Medien-ID kopiert\",\"kb8bf9961\":\"Primär: {{primary}} Zeilen · Sekundär: {{secondary}} Zeilen\",\"kb94b892f\":\"Aus Bild generieren\",\"kb95b2cbd\":\"Was ist YuanCut?\",\"kba302158\":\"Nur kommerziell lizenzierte anzeigen\",\"kbac6a8e2\":\"Keine Anmeldung erforderlich\",\"kbb83e4af\":\
